# Android CI Build
# এই workflow টা app/ মডিউল থেকে Gradle চালাবে — যেখানে আপনার Android প্রকল্প হতে পারে
name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle CLI
      uses: gradle/actions/setup-gradle@v3

    - name: Ensure app/ exists
      run: |
        if [ ! -d ./app ]; then
          echo "ERROR: app/ directory not found. Please ensure Android project is under app/ or update workflow path."
          exit 1
        fi

    - name: Generate Gradle Wrapper if missing (in app/)
      working-directory: ./app
      run: |
        # If wrapper script not present, attempt to create wrapper using installed Gradle CLI
        if [ ! -f ./gradlew ]; then
          echo "gradlew not found in app/ — running 'gradle wrapper' to generate it"
          gradle wrapper
        else
          echo "gradlew already present in app/"
        fi

    - name: Grant execute permission for gradlew (in app/)
      working-directory: ./app
      run: chmod +x gradlew

    - name: Build with Gradle (in app/)
      working-directory: ./app
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk